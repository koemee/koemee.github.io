<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Age & Milestone Calculator</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    h1 {
      font-size: 1.5rem;
      margin-top: 0;
      text-align: center;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #94a3b8;
      font-size: 0.9rem;
    }
    input[type="date"] {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      font-size: 1rem;
      box-sizing: border-box;
      margin-bottom: 1rem;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #2563eb;
    }
    .results {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #334155;
      display: none;
    }
    .stat {
      margin-bottom: 0.75rem;
      font-size: 1rem;
    }
    .highlight {
      color: #38bdf8;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Age Calculator</h1>
    <label for="dob">Enter Date of Birth</label>
    <input type="date" id="dob" />
    <button onclick="calculateAge()">Calculate Age</button>

    <div class="results" id="results">
      <div class="stat">Exact Age: <span class="highlight" id="exactAge"></span></div>
      <div class="stat">Total Days Lived: <span class="highlight" id="totalDays"></span></div>
      <div class="stat">Next Birthday In: <span class="highlight" id="nextBirthday"></span></div>
    </div>
  </div>

  <script>
    function calculateAge() {
      const dobInput = document.getElementById("dob").value;
      if (!dobInput) {
        alert("Please select a valid date of birth.");
        return;
      }

      const dob = new Date(dobInput + "T00:00:00");
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      if (dob > today) {
        alert("Date of birth cannot be in the future.");
        return;
      }

      let years = today.getFullYear() - dob.getFullYear();
      let months = today.getMonth() - dob.getMonth();
      let days = today.getDate() - dob.getDate();

      if (days < 0) {
        months--;
        const previousMonth = new Date(today.getFullYear(), today.getMonth(), 0);
        days += previousMonth.getDate();
      }

      if (months < 0) {
        years--;
        months += 12;
      }

      const oneDayMs = 1000 * 60 * 60 * 24;
      const totalDays = Math.floor((today - dob) / oneDayMs);

      let nextBday = new Date(today.getFullYear(), dob.getMonth(), dob.getDate());
      if (nextBday < today) {
        nextBday.setFullYear(today.getFullYear() + 1);
      }
      const daysUntilBday = Math.ceil((nextBday - today) / oneDayMs);

      document.getElementById("exactAge").textContent = `${years} years, ${months} months, ${days} days`;
      document.getElementById("totalDays").textContent = totalDays.toLocaleString();
      document.getElementById("nextBirthday").textContent =
        daysUntilBday === 0 ? "Happy Birthday today!" : `${daysUntilBday} days`;

      document.getElementById("results").style.display = "block";
    }
  </script>
</body>
</html>
